# ApplicationSet for self-built apps only (freelance-agency-template, ...).
# Shared platform utilities (registry, vault) live under platform/ instead —
# see platform/appset-utilities.yaml — even though both land in lab-thanhlam, because
# this template's image-updater annotations assume a self-built
# thanhlamcode/<name> image on Docker Hub, which platform utilities don't have.
# Follows the Truedoc pattern: one shared chart, one values.yaml per folder.
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: app-development
  namespace: argocd-thanhlam
spec:
  generators:
    - git:
        directories:
          - path: app/development/*
        repoURL: https://github.com/heloooo-maker/gitops.git
        revision: main
  ignoreApplicationDifferences:
    - jqPathExpressions:
        - .spec.sources[]
  template:
    metadata:
      name: "{{path.basename}}-development"
      annotations:
        argocd-image-updater.argoproj.io/image-list: app=harbor.thanhlam.online/library/{{path.basename}}
        argocd-image-updater.argoproj.io/app.allow-tags: regexp:^[0-9a-f]{40}$
        argocd-image-updater.argoproj.io/app.ignore-tags: latest, regexp:^latest.*$
        argocd-image-updater.argoproj.io/app.update-strategy: newest-build
        argocd-image-updater.argoproj.io/app.helm.image-name: image.repository
        argocd-image-updater.argoproj.io/app.helm.image-tag: image.tag
        argocd-image-updater.argoproj.io/app.pull-secret: pullsecret:lab-thanhlam/harbor-pull-secret
        argocd-image-updater.argoproj.io/write-back-method: git:secret:argocd-thanhlam/repo-gitops
        argocd-image-updater.argoproj.io/write-back-target: helmvalues:/app/development/{{path.basename}}/values.yaml
        argocd-image-updater.argoproj.io/git-branch: main
        argocd-image-updater.argoproj.io/git-repository: https://github.com/heloooo-maker/gitops.git
    spec:
      project: app-development
      destination:
        server: https://kubernetes.default.svc
        namespace: lab-thanhlam
      sources:
        # Classic HTTPS chart repo (charts.thanhlam.online), not the git path
        # or the OCI copy — matches the Long Van / truedoc "2 distinct
        # Sources" pattern. Self-built apps never need to bootstrap before
        # charts-repo does (unlike platform/appset-utilities.yaml's
        # "registry"/"cloudflared" entries, which must stay on the git path).
        - chart: general
          repoURL: https://charts.thanhlam.online
          targetRevision: "1.0.0"
          helm:
            valueFiles:
              - $values/app/development/{{path.basename}}/values.yaml
        - ref: values
          repoURL: https://github.com/heloooo-maker/gitops.git
          targetRevision: main
      syncPolicy:
        automated:
          prune: true
        syncOptions:
          - ApplyOutOfSyncOnly=true
          - CreateNamespace=true
