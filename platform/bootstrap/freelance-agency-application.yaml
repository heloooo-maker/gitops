# Application "freelance-agency" uses a shared Helm chart plus app-specific values.
# This follows the Truedoc pattern: reusable templates live in charts/, values live in apps/.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: freelance-agency
  namespace: argocd-thanhlam
  annotations:
    argocd-image-updater.argoproj.io/image-list: web=thanhlamcode/freelance-agency-template
    argocd-image-updater.argoproj.io/web.allow-tags: regexp:^[0-9a-f]{40}$
    argocd-image-updater.argoproj.io/web.update-strategy: newest-build
    argocd-image-updater.argoproj.io/web.helm.image-name: image.repository
    argocd-image-updater.argoproj.io/web.helm.image-tag: image.tag
    argocd-image-updater.argoproj.io/write-back-method: git
    argocd-image-updater.argoproj.io/write-back-target: helmvalues:/apps/freelance-agency/values.yaml
    argocd-image-updater.argoproj.io/git-branch: main
spec:
  project: freelance-agency
  sources:
    - repoURL: https://github.com/heloooo-maker/gitops.git
      targetRevision: main
      path: charts/web-app
      helm:
        valueFiles:
          - $values/apps/freelance-agency/values.yaml
    - repoURL: https://github.com/heloooo-maker/gitops.git
      targetRevision: main
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: lab2
  syncPolicy:
    automated:
      enabled: true
      prune: true
      selfHeal: true
