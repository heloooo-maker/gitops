# Application "root" is the app-of-apps entry point. AppProject/ApplicationSet
# files live co-located with what they manage (app/development/ here,
# platform-gitops' own root for platform/*) — matching truedoc's convention
# where appset-<env>.yaml sits inside truedoc/<env>/ next to the apps
# themselves.
# `include` (allow-list) is used instead of `exclude` here on purpose: each
# source recurses its WHOLE repo, and an allow-list means a mistake just
# misses a new file rather than crashing on some unrelated values.yaml/chart
# template.
# Sync policy is manual on purpose so bootstrap/project/appset changes can be reviewed first.
#
# Two sources since the 2026-10-10 repo split (was a single-repo monorepo
# before): this repo (heloooo-maker/gitops) owns app/development/*, and
# heloooo-maker/platform-gitops owns everything under what used to be
# platform/ here.
#
# platform-gitops/jfrog/vault-wiring.yaml is deliberately NOT in either
# include list — the AppProject "platform" (this Application's own project)
# doesn't whitelist the lab-thanhlam destination that file targets (kept
# separate from app-development on purpose), so it's applied by hand once
# with `kubectl apply -f`, same as app/development/vault-auth.yaml below.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: root
  namespace: argocd-thanhlam
spec:
  project: platform
  sources:
    - repoURL: https://github.com/heloooo-maker/gitops.git
      targetRevision: main
      path: "."
      directory:
        recurse: true
        include: "{app/development/appproject.yaml,app/development/appset.yaml}"
    - repoURL: https://github.com/heloooo-maker/platform-gitops.git
      targetRevision: main
      path: "."
      directory:
        recurse: true
        include: "{appproject.yaml,appset-utilities.yaml,appset-repo-charts.yaml,vault-init-rbac.yaml}"
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd-thanhlam
  syncPolicy: {}
