# AppProject for Helo development applications.
#
# platform-gitops.git added 2026-10-10 (repo split): JFrog lives physically
# in that repo now (it was platform/jfrog/ pre-split) but stays in THIS
# project — its chart.yaml always declared project: app-development, since
# it deploys into lab-thanhlam like resoweb/freelance-agency-template, not
# into any platform-project namespace. Its generated Application's
# `ref: values` source points back at platform-gitops.git for its
# values.yaml, which needs to be whitelisted here.
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: app-development
  namespace: argocd-thanhlam
spec:
  description: "Helo development apps generated by ApplicationSet"
  sourceRepos:
    - https://github.com/heloooo-maker/gitops.git
    - https://github.com/heloooo-maker/platform-gitops.git
    - https://charts.thanhlam.online
    - https://charts.jfrog.io
  destinations:
    - namespace: lab-thanhlam
      server: https://kubernetes.default.svc
  clusterResourceWhitelist:
    - group: ""
      kind: Namespace
    - group: rbac.authorization.k8s.io
      kind: ClusterRole
    - group: rbac.authorization.k8s.io
      kind: ClusterRoleBinding
