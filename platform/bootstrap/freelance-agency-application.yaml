# Application "freelance-agency" -> theo dõi folder app/ trong repo gitops
# LƯU Ý: file này CHỈ để lưu trữ/tham khảo, không được ArgoCD tự sync (nằm trong bootstrap/, bị exclude)
# (bootstrap object - phải tạo bằng tay 1 lần qua kubectl apply)
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: freelance-agency
  namespace: argocd-thanhlam
spec:
  project: freelance-agency
  source:
    repoURL: https://github.com/heloooo-maker/gitops.git
    targetRevision: main
    path: "app"
  destination:
    server: https://kubernetes.default.svc
    namespace: lab2
  syncPolicy:
    automated:
      enabled: true
      prune: true
      selfHeal: true
