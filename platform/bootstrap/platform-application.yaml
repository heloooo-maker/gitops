# Application "platform" -> theo dõi folder platform/ trong repo freelance-agency-gitops (đã gộp chung 1 repo)
# LƯU Ý: file này CHỈ để lưu trữ/tham khảo, không được ArgoCD tự sync
# (bootstrap object - self-referential, phải tạo bằng tay 1 lần đầu qua kubectl apply)
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: platform
  namespace: argocd-thanhlam
spec:
  project: platform
  source:
    repoURL: https://github.com/heloooo-maker/freelance-agency-gitops.git
    targetRevision: main
    path: "platform"
    directory:
      recurse: true
      exclude: "{argocd/README.md,argocd/values.yaml,bootstrap/*}"
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd-thanhlam
  syncPolicy:
    automated:
      enabled: true
      prune: true
      selfHeal: true
