{{- if .Values.vaultSecret.enabled }}
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: {{ include "gea.fullname" $ }}-vault
  namespace: {{ $.Release.Namespace }}
  labels:
    {{- include "gea.labels" $ | nindent 4 }}
spec:
  vaultAuthRef: {{ .Values.vaultSecret.vaultAuthRef | default "vault-auth" }}
  mount: {{ .Values.vaultSecret.mount | default "secret" }}
  type: kv-v2
  path: {{ .Values.vaultSecret.path | required "vaultSecret.path is required" }}
  refreshAfter: {{ .Values.vaultSecret.refreshAfter | default "60s" }}
  destination:
    create: true
    name: {{ .Values.vaultSecret.secretName | required "vaultSecret.secretName is required" }}
{{- end }}
