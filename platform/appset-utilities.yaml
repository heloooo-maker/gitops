# ApplicationSet for the general chart's bootstrap-safe consumer: cloudflared.
# Stays pinned to the git path (charts/general@main), never a registry/OCI
# copy — cloudflared owns the tunnel route to every other hostname
# (including any future self-hosted registry), so it must never depend on
# one of those routes being up just to fetch its own chart.
# (The registry:2 + charts-repo combo that used to live here was retired in
# favor of Harbor, which now hosts every self-built image instead.)
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: platform-utilities
  namespace: argocd-thanhlam
spec:
  generators:
    - git:
        files:
          - path: platform/*/source.yaml
        repoURL: https://github.com/heloooo-maker/gitops.git
        revision: main
  ignoreApplicationDifferences:
    - jqPathExpressions:
        - .spec.sources[]
  template:
    metadata:
      name: "{{path.basename}}"
    spec:
      project: "{{project}}"
      destination:
        server: https://kubernetes.default.svc
        namespace: "{{namespace}}"
      sources:
        - path: charts/general
          repoURL: https://github.com/heloooo-maker/gitops.git
          targetRevision: main
          helm:
            valueFiles:
              - $values/platform/{{path.basename}}/values.yaml
        - ref: values
          repoURL: https://github.com/heloooo-maker/gitops.git
          targetRevision: main
      syncPolicy:
        automated:
          prune: true
        syncOptions:
          - ApplyOutOfSyncOnly=true
          - CreateNamespace=true
