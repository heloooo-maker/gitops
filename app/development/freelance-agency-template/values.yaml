# Rendered from the shared "general" chart (charts/general in this repo)
# — same chart as every other platform component, per the centralize-chart
# pattern. deploy name is the project name itself (not a generic "web") so it
# can never collide with another app sharing this namespace: the Deployment's
# own name is the literal deploy name, with no release-name prefix.
image:
  repository: harbor.thanhlam.online/library/freelance-agency-template
  tag: 8e3141b2fec20b9739701ea5a19ff05307db2456
  pullPolicy: IfNotPresent

imagePullSecrets:
  - name: harbor-pull-secret

serviceAccount:
  create: false

secrets:
  enabled: false

# Vault Secrets Operator demo: syncs secret/freelance-agency-template (Vault
# dev instance, platform/vault) into this K8s Secret, mounted below.
# Requires app/development/vault-auth.yaml applied once in this namespace.
vaultSecret:
  enabled: true
  path: freelance-agency-template
  secretName: freelance-agency-template-vault-demo

deployments:
  - name: freelance-agency-template
    replicasCount: 2
    mountSecrets:
      - name: freelance-agency-template-vault-demo
        mountPath: /vault/secrets
    service:
      name: freelance-agency-template
      port: 80
      containerPort: 80
      healthType: http
      health:
        live: /
        ready: /
        initialDelaySeconds: 2

ingress:
  enabled: true
  ingressClassName: nginx
  tls: [] # TLS terminates at the Cloudflare Tunnel edge, not here
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
  rules:
    - host: lab2.thanhlam.online
      paths:
        - path: /
          pathType: Prefix
          serviceName: freelance-agency-template
          servicePort: 80
