# AppProject "platform" -> scope cho argocd-thanhlam/tunnel-system: root,
# argocd (self-management), image-updater, cloudflared.
# Bootstrap object: phải tạo bằng tay 1 lần trước khi Application "root"
# (project: platform) tồn tại được — xem root-application.yaml.
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: platform
  namespace: argocd-thanhlam
spec:
  description: "Ha tang dung chung (ArgoCD, image-updater, cloudflared) - tach rieng khoi app de tranh cascade-delete lan nhau"
  sourceRepos:
    - https://github.com/heloooo-maker/gitops.git
    - https://argoproj.github.io/argo-helm
    - oci://registry.thanhlam.online/helm
  destinations:
    - namespace: argocd-thanhlam
      server: https://kubernetes.default.svc
    - namespace: tunnel-system
      server: https://kubernetes.default.svc
  clusterResourceWhitelist:
    - group: rbac.authorization.k8s.io
      kind: ClusterRole
    - group: rbac.authorization.k8s.io
      kind: ClusterRoleBinding
