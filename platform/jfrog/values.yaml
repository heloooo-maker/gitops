# JFrog Container Registry (JCR) — replaces Harbor (platform/harbor removed)
# as the Docker + Helm OCI registry. JCR is the free registry-only slice of
# the full Artifactory chart, scoped to exactly what Harbor covered here
# (library/* image pushes + the general chart's OCI package) — no
# universal-repo-manager features we don't use.
#
# NOTE: Harbor was removed before this cutover was finished. Until the
# manual steps below are done AND charts-repo/image-updater/app-development/*
# values + the chart-publish CI workflow are updated from harbor.thanhlam.online
# to jfrog.thanhlam.online, those consumers cannot pull/push images.
#
# Manual one-time steps after first sync (can't be done from git):
#   1. Log in at https://jfrog.thanhlam.online with the default admin/password
#      and set a real admin password.
#   2. Create local repositories for what Harbor served as "library" —
#      a Docker repo (e.g. "docker-local") and a Helm repo (e.g.
#      "helm-local") — via the UI or REST API. Unlike Harbor, JCR has no
#      built-in default project/repo.
#   3. Create an access token / pull-secret-worthy user for
#      argocd-image-updater and the cluster's image pull secret.
#
# This chart wraps the full "artifactory" chart as a dependency — most keys
# live one level down, under `artifactory:`.
# (full reference: https://github.com/jfrog/charts/tree/master/stable/artifactory)

# Mandatory since this chart version — Artifactory refuses to render without
# a master key + join key. Read from a Secret created directly on the
# cluster (kubectl), never in git: `kubectl create secret generic
# artifactory-mandatory-keys -n lab-thanhlam --from-literal=master-key=...
# --from-literal=join-key=...` (same pattern as Harbor's admin password).
global:
  masterKeySecretName: artifactory-mandatory-keys
  joinKeySecretName: artifactory-mandatory-keys

artifactory:
  nginx:
    enabled: false # ingress-nginx (already on the cluster) terminates instead, same pattern as every other platform/* component

  ingress:
    enabled: true
    className: nginx
    hosts:
      - jfrog.thanhlam.online
    annotations:
      nginx.ingress.kubernetes.io/ssl-redirect: "false" # TLS terminates at the Cloudflare Tunnel edge, not here
      nginx.ingress.kubernetes.io/proxy-body-size: "0" # unbounded — needed for large image layer pushes

  artifactory:
    # Homelab, single node pool, replacing a Harbor that was running fine on
    # similar resources — not sized for production load.
    resources:
      requests:
        cpu: 250m
        memory: 1Gi
      limits:
        cpu: "1"
        memory: 3Gi
    javaOpts:
      xms: "512m"
      xmx: "2g" # chart requires resources.limits.memory to stay >=1Gi above xmx

    persistence:
      size: 20Gi # matches Harbor's registry PVC
      storageClassName: local-path

  postgresql:
    enabled: true
    primary:
      persistence:
        size: 5Gi # matches Harbor's database PVC; default chart size (200Gi) is way oversized for a homelab
