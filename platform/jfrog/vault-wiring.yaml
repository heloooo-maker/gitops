# Syncs secret/jfrog (seeded by platform/vault-bootstrap) into the
# artifactory-mandatory-keys Secret that platform/jfrog/values.yaml points
# global.masterKeySecretName/joinKeySecretName at.
#
# Reuses the lab-thanhlam VaultConnection/VaultAuth already applied by hand
# (app/development/vault-auth.yaml — role lab-thanhlam-demo, serviceAccount:
# default) instead of a dedicated one: the artifactory-jcr chart runs its
# pods as that namespace's default ServiceAccount, same as
# resoweb/freelance-agency-template, so it already satisfies that role's
# binding.
#
# This file (unlike vault-auth.yaml) IS auto-synced — see
# bootstrap/root-application.yaml's include list.
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: jfrog-vault
  namespace: lab-thanhlam
spec:
  vaultAuthRef: vault-auth
  mount: secret
  type: kv-v2
  path: jfrog
  refreshAfter: 60s
  destination:
    create: true
    name: artifactory-mandatory-keys
