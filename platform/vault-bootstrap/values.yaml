# platform/vault is standalone with real persisted storage now, so this
# config (audit device, auth method, policy, role, the Grafana KV secret)
# survives ordinary restarts on its own - it only needs REDOING if Vault's
# storage was ever wiped (PVC lost, or a brand new `vault operator init` -
# see platform/vault-init). This CronJob re-applies it every 5 minutes
# anyway as a cheap defensive self-heal:
#   1. the "secret/" KV-v2 engine itself - dev mode auto-mounts this, real
#      standalone Vault starts with NO secret engines at all
#   2. audit device -> stdout (platform/promtail ships it as a container log)
#   3. kubernetes auth method + a read-only role for the Grafana pod
#   4. the Grafana admin credential in KV (only written once - if the path
#      already holds a value this leaves it alone, so a manually rotated
#      password survives future runs)
# VAULT_TOKEN reads the root token platform/vault-init generated at
# `vault operator init` time and stored in the "vault-init" Secret - it
# can't be stored INSIDE Vault itself (nothing to authenticate the
# bootstrap with otherwise). Until vault-init has run at least once
# (first-ever boot), this Secret doesn't exist yet and this CronJob's runs
# fail - expected, and it self-heals on the next 5-minute tick.
# Runs on the general chart (charts/general) as a CronJob-only app - no
# Deployment, no Service.
image:
  repository: hashicorp/vault
  tag: "1.18"
  pullPolicy: IfNotPresent

# Public Docker Hub image - the chart's default imagePullSecrets ("registry")
# doesn't exist in vault-thanhlam and isn't needed here.
imagePullSecrets: []

deployments: []

secrets:
  enabled: false

env:
  VAULT_ADDR: http://vault.vault-thanhlam.svc.cluster.local:8200
  VAULT_TOKEN: "secret:vault-init.root-token"

cronJobs:
  - name: bootstrap
    schedule: "*/5 * * * *"
    command:
      - /bin/sh
      - -c
    args:
      - |
        set -e

        vault secrets enable -path=secret kv-v2 || true

        vault audit enable file file_path=stdout || true

        vault auth enable kubernetes || true
        vault write auth/kubernetes/config kubernetes_host=https://kubernetes.default.svc:443

        vault policy write grafana-read - <<'EOF'
        path "secret/data/vault-thanhlam/grafana" {
          capabilities = ["read"]
        }
        EOF

        vault write auth/kubernetes/role/vault-thanhlam-grafana \
          bound_service_account_names=grafana \
          bound_service_account_namespaces=vault-thanhlam \
          policies=grafana-read \
          ttl=1h

        if ! vault kv get secret/vault-thanhlam/grafana >/dev/null 2>&1; then
          PASSWORD=$(head -c18 /dev/urandom | base64 | tr -dc 'A-Za-z0-9' | head -c20)
          vault kv put secret/vault-thanhlam/grafana admin-user=admin admin-password="$PASSWORD"
        fi

        # lab-thanhlam-demo: formalizes a role that previously only existed
        # as an ad hoc `vault write` (see app/development/vault-auth.yaml,
        # still applied by hand — only the policy/role content moved here).
        # Shared by every app in lab-thanhlam that runs as that namespace's
        # default ServiceAccount (resoweb, freelance-agency-template, jfrog)
        # — not per-app isolated like vault-thanhlam-grafana above, matching
        # how this namespace was already set up.
        vault policy write lab-thanhlam-demo - <<'EOF'
        path "secret/data/resoweb" {
          capabilities = ["read"]
        }
        path "secret/data/freelance-agency-template" {
          capabilities = ["read"]
        }
        path "secret/data/jfrog" {
          capabilities = ["read"]
        }
        EOF

        vault write auth/kubernetes/role/lab-thanhlam-demo \
          bound_service_account_names=default \
          bound_service_account_namespaces=lab-thanhlam \
          policies=lab-thanhlam-demo \
          ttl=1h

        # JFrog's master/join keys (see platform/jfrog/values.yaml,
        # global.masterKeySecretName/joinKeySecretName) - generated once,
        # same "only if missing" pattern as the Grafana password above, so a
        # manually rotated value survives future runs and Vault's own
        # storage is the only place either key is ever written down. NOT
        # auto-rotated: Artifactory treats the master key as fixed
        # post-install (it encrypts on-disk config), so a changed value
        # here would NOT get re-read live - this only matters for disaster
        # recovery / re-seeding a fresh Vault before first boot.
        if ! vault kv get secret/jfrog >/dev/null 2>&1; then
          # No openssl in this image (confirmed) - same /dev/urandom+base64
          # approach as the Grafana password above, just longer. Artifactory
          # only needs a sufficiently long random string here, not strictly
          # hex.
          MASTER_KEY=$(head -c48 /dev/urandom | base64 | tr -dc 'A-Za-z0-9' | head -c48)
          JOIN_KEY=$(head -c48 /dev/urandom | base64 | tr -dc 'A-Za-z0-9' | head -c48)
          vault kv put secret/jfrog master-key="$MASTER_KEY" join-key="$JOIN_KEY"
        fi
    resources:
      requests:
        cpu: 10m
        memory: 32Mi
      limits:
        cpu: 100m
        memory: 96Mi

serviceAccount:
  create: false
