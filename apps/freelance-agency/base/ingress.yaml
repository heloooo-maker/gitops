# Ingress -> rule routing: host lab2.thanhlam.online -> Service "web" port 80
# HTTPS thật xử lý ở Cloudflare Edge (trước tunnel) -> không cần cert-manager/TLS ở đây, tránh cấu hình chết
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: web
  namespace: lab2
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
spec:
  ingressClassName: nginx
  rules:
    - host: lab2.thanhlam.online
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: web
                port:
                  number: 80
