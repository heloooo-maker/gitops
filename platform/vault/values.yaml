# HashiCorp Vault, now on the OFFICIAL hashicorp/vault-helm chart instead of
# the shared `general` chart — production posture needs Raft storage + a
# seal stanza the generic chart has no template support for.
#
# Raft (not file) storage: kept even at replicas: 1 because Raft is what
# gives snapshot/restore and a clean path to adding replicas later — file
# storage has neither. HA is NOT enabled for failover here: this is a
# single-node cluster, so a 2nd/3rd replica would just be 2 more pods stuck
# on the same node, buying nothing.
#
# Seal is plain Shamir (manual unseal after every pod restart) — a second
# "unseal" Vault to auto-unseal this one was tried and dropped: running 2
# Vaults just to avoid unsealing 1 by hand wasn't worth the extra system to
# maintain for a single-user homelab. Revisit only if a real cloud KMS
# becomes available (AWS/GCP/Azure seal, no second Vault needed).
#
# In-cluster TLS is still disabled (tls_disable = 1), same as before: TLS
# terminates at the Cloudflare Tunnel edge, and the nginx-ingress -> pod hop
# stays on the single-node cluster network. Turning this on for real would
# need cert-manager (not present in this repo) issuing a cert Vault can
# mount — deliberately out of scope here, flagging it rather than silently
# leaving it unclear.
#
# Values below are the standard hashicorp/vault-helm schema — verify against
# `helm show values hashicorp/vault --version 0.34.1` before the first sync,
# no local helm/cluster access was available to dry-run this chart version.
#
# One-time manual bootstrap:
#   1. kubectl exec -it vault-0 -n lab-thanhlam -- vault operator init
#      -key-shares=1 -key-threshold=1   (single share: no one else depends on
#      this Vault's uptime day-to-day, so the usual multi-share quorum isn't
#      worth the extra step here)
#   2. vault operator unseal <the one key>
#   Save the unseal key + root token somewhere safe OUTSIDE this repo (e.g. a
#   password manager), never in git. Repeat step 2 after every pod restart.

injector:
  enabled: false # apps consume secrets via ExternalSecret today, not vault-agent sidecar injection

server:
  image:
    repository: hashicorp/vault
    tag: "1.19"

  ha:
    enabled: true
    replicas: 1
    raft:
      enabled: true
      config: |
        ui = true
        listener "tcp" {
          address     = "[::]:8200"
          tls_disable = 1
        }
        storage "raft" {
          path = "/vault/data"
        }
        service_registration "kubernetes" {}

  dataStorage:
    enabled: true
    size: 5Gi
    storageClass: local-path
    accessMode: ReadWriteOnce

  ingress:
    enabled: true
    ingressClassName: nginx
    annotations:
      nginx.ingress.kubernetes.io/ssl-redirect: "false" # TLS terminates at the Cloudflare Tunnel edge
    hosts:
      - host: vault.thanhlam.online
        paths:
          - /

ui:
  enabled: true
  serviceType: ClusterIP
