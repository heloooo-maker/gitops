# Application "root" is the app-of-apps entry point for bootstrap resources.
# Sync policy is manual on purpose so bootstrap/project/appset changes can be reviewed first.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: root
  namespace: argocd-thanhlam
spec:
  project: platform
  source:
    repoURL: https://github.com/heloooo-maker/gitops.git
    targetRevision: main
    path: "platform/bootstrap"
    directory:
      recurse: true
      exclude: "root-application.yaml"
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd-thanhlam
  syncPolicy: {}
