# Log store for the vault-thanhlam audit pipeline: promtail -> loki -> grafana
# (see platform/promtail, platform/grafana). SingleBinary/filesystem mode -
# one small pod, one small PVC (local-path) - no S3/GCS, no read/write/backend
# split. Right-sized for a single Vault pod's audit stream, not a general
# cluster-wide log sink (that would need object storage + real replication).
deploymentMode: SingleBinary

loki:
  auth_enabled: false
  commonConfig:
    replication_factor: 1
  storage:
    type: filesystem
  schemaConfig:
    configs:
      - from: "2024-04-01"
        store: tsdb
        object_store: filesystem
        schema: v13
        index:
          prefix: loki_index_
          period: 24h

singleBinary:
  replicas: 1
  persistence:
    enabled: true
    size: 5Gi
  resources:
    requests:
      cpu: 50m
      memory: 256Mi
    limits:
      cpu: 250m
      memory: 512Mi

# Zero out the SimpleScalable/Distributed targets - SingleBinary runs everything.
read:
  replicas: 0
write:
  replicas: 0
backend:
  replicas: 0

gateway:
  enabled: false
test:
  enabled: false
lokiCanary:
  enabled: false
monitoring:
  serviceMonitor:
    enabled: false
  selfMonitoring:
    enabled: false
  lokiCanary:
    enabled: false
