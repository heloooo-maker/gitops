# AppProject "freelance-agency" -> gioi han pham vi cho Application "freelance-agency"
# LUU Y: file nay CHI de luu tru/tham khao, khong duoc ArgoCD tu sync (nam trong bootstrap/, bi exclude)
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: freelance-agency
  namespace: argocd-thanhlam
spec:
  description: "App freelance-agency-template - chi duoc trong repo va namespace rieng cua no"
  sourceRepos:
    - https://github.com/heloooo-maker/gitops.git
  destinations:
    - namespace: lab2
      server: https://kubernetes.default.svc
  clusterResourceWhitelist:
    - group: ""
      kind: Namespace
