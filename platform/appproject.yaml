# AppProject "platform" -> scope for argocd-thanhlam/tunnel-system: root,
# argocd (self-management), image-updater, cloudflared, vault, vault-secrets-operator.
# Bootstrap object: must be created by hand once before the "root" Application
# (project: platform) can exist — see root-application.yaml.
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: platform
  namespace: argocd-thanhlam
spec:
  description: "Ha tang dung chung (ArgoCD, image-updater, cloudflared, vault) - tach rieng khoi app de tranh cascade-delete lan nhau"
  sourceRepos:
    - https://github.com/heloooo-maker/gitops.git
    - https://argoproj.github.io/argo-helm
    - oci://registry.thanhlam.online/helm
    - https://helm.releases.hashicorp.com
  destinations:
    - namespace: argocd-thanhlam
      server: https://kubernetes.default.svc
    - namespace: tunnel-system
      server: https://kubernetes.default.svc
    - namespace: vault-thanhlam
      server: https://kubernetes.default.svc
    - namespace: vault-secrets-operator-thanhlam
      server: https://kubernetes.default.svc
  clusterResourceWhitelist:
    - group: rbac.authorization.k8s.io
      kind: ClusterRole
    - group: rbac.authorization.k8s.io
      kind: ClusterRoleBinding
    - group: apiextensions.k8s.io
      kind: CustomResourceDefinition
