# AppProject for Helo development applications.
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: helo-development
  namespace: argocd-thanhlam
spec:
  description: "Helo development apps generated by ApplicationSet"
  sourceRepos:
    - https://github.com/heloooo-maker/gitops.git
  destinations:
    - namespace: lab2
      server: https://kubernetes.default.svc
  clusterResourceWhitelist:
    - group: ""
      kind: Namespace
