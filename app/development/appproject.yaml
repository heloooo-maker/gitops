# AppProject for Helo development applications.
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: app-development
  namespace: argocd-thanhlam
spec:
  description: "Helo development apps generated by ApplicationSet"
  sourceRepos:
    - https://github.com/heloooo-maker/gitops.git
    - oci://registry.thanhlam.online/general
    - https://helm.releases.hashicorp.com
  destinations:
    - namespace: lab-thanhlam
      server: https://kubernetes.default.svc
  clusterResourceWhitelist:
    - group: ""
      kind: Namespace
    - group: rbac.authorization.k8s.io
      kind: ClusterRole
    - group: rbac.authorization.k8s.io
      kind: ClusterRoleBinding
