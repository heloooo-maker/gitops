# Ingress cho chính ArgoCD server (namespace argocd-thanhlam)
# Được Application "platform" (project "platform") tự động sync - KHÔNG đứng chung Application với app freelance-agency
# HTTPS thật xử lý ở Cloudflare Edge (trước tunnel) -> không cần cert-manager/TLS ở đây, tránh cấu hình chết
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: argocd-server
  namespace: argocd-thanhlam
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
spec:
  ingressClassName: nginx
  rules:
    - host: argocd.thanhlam.online
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: argocd-argocd-thanhlam-server
                port:
                  number: 80
