# Self-hosted Docker registry, replacing Docker Hub for helo-gitops images.
# Built on the shared "general" chart (charts/general in this repo).
image:
  repository: registry
  tag: "2"

# The chart's default values.yaml ships a leftover imagePullSecrets/ingress.tls
# from its original example (gea.vn) — both leak through unless overridden
# here, since Helm deep-merges per key rather than replacing the whole block.
imagePullSecrets: []

serviceAccount:
  create: false

# The chart's own default values.yaml omits this key entirely, and
# external-secret.yaml / deployment.yaml both dereference it unconditionally
# — every consumer of this chart must set it or rendering fails outright.
secrets:
  enabled: false

deployments:
  - name: registry
    replicasCount: 1
    env:
      REGISTRY_AUTH: htpasswd
      REGISTRY_AUTH_HTPASSWD_REALM: "Registry"
      REGISTRY_AUTH_HTPASSWD_PATH: /auth/htpasswd
      REGISTRY_STORAGE_FILESYSTEM_ROOTDIRECTORY: /var/lib/registry
    service:
      name: registry
      port: 5000
      containerPort: 5000
      # /v2/ returns 401 with htpasswd auth on and no creds sent (expected) —
      # TCP-only avoids treating that as unhealthy.
      healthType: "tcp"
      # The chart dereferences service.health fields unconditionally even
      # when healthType needs none of them — must be present (can be empty).
      health: {}
    resources:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        cpu: 500m
        memory: 256Mi
    # References a Secret created directly on the cluster (kubectl), never
    # committed here — this chart is NOT given `secret:` values, so it never
    # renders one. See platform/registry/README.md for how it was created.
    mountSecrets:
      - name: registry-htpasswd
        mountPath: /auth
    mountPVC:
      - name: registry
        mountPath: /var/lib/registry

persistence:
  enabled: true
  size: 20Gi
  storageClassName: local-path
  accessModes:
    - ReadWriteOnce

ingress:
  enabled: true
  ingressClassName: nginx
  tls: [] # TLS terminates at the Cloudflare Tunnel edge, not here
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "false" # TLS terminates at the Cloudflare Tunnel edge
    nginx.ingress.kubernetes.io/proxy-body-size: "0" # unlimited — image layers can exceed the 1m default
    nginx.ingress.kubernetes.io/proxy-read-timeout: "600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "600"
  rules:
    - host: registry.thanhlam.online
      paths:
        - path: /
          pathType: Prefix
          serviceName: registry
          servicePort: 5000
